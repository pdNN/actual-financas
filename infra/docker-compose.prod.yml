# >>> CUSTOM: actual-financas — logs dos containers no Cloud Logging
# Driver `gcplogs` do próprio dockerd: não há agente extra, então o custo de
# memória na e2-micro é desprezível (o Ops Agent, com Fluent Bit + OTel
# Collector, consome centenas de MB e não cabe). Projeto e instância são
# detectados pelo metadata server; a autorização vem da SA da VM
# (roles/logging.logWriter, ver iam.tf).
#   - non-blocking: se o Cloud Logging cair, o container segue servindo e
#     descarta o excedente em vez de travar a escrita no stdout.
#   - cache-*: `docker logs` (usado pelo deploy.sh no rollback) continua
#     funcionando por um cache local, com teto de disco.
# O access log do Caddy vai para arquivo (ver Caddyfile), não para o stdout —
# portanto IP e caminho das requisições NÃO são enviados ao GCP (princípio VIII).
x-logging: &gcp-logging
  driver: gcplogs
  options:
    mode: non-blocking
    max-buffer-size: 4m
    cache-max-size: 10m
    cache-max-file: '2'
# <<< CUSTOM

services:
  actual:
    # Tag imutável (SHA do commit), injetada pelo deploy.sh. O default `edge`
    # existe só para subir à mão numa emergência — deploy normal sempre passa
    # um SHA, porque `edge` muda debaixo dos pés e impossibilita rollback.
    image: ghcr.io/pdnn/actual-server:${ACTUAL_IMAGE_TAG:-edge}
    container_name: actual-budget
    restart: always
    logging: *gcp-logging
    # Non-sensitive config — versioned here. Sensitive secrets in .env via Secret Manager.
    environment:
      ACTUAL_PORT: '5006'
      ACTUAL_DATA_DIR: /data
      ACTUAL_LOGIN_METHOD: openid
      ACTUAL_OPENID_AUTH_METHOD: oauth2
      ACTUAL_OPENID_PROVIDER_NAME: Google
      ACTUAL_OPENID_DISCOVERY_URL: https://accounts.google.com/.well-known/openid-configuration
      ACTUAL_OPENID_SERVER_HOSTNAME: https://actual-financas.fglivraria.com
      ACTUAL_TOKEN_EXPIRATION: never
    env_file:
      - .env
    # Só no loopback: o Caddy alcança este serviço pelo nome na rede do Docker
    # (`reverse_proxy actual:5006`), então não há motivo para a porta escutar em
    # 0.0.0.0. Mantida em 127.0.0.1 para permitir `curl localhost:5006` ao
    # depurar na VM.
    ports:
      - '127.0.0.1:5006:5006'
    volumes:
      - /opt/actual/data:/data
    networks:
      - actual-net
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5006').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    logging: *gcp-logging
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/actual/caddy_data:/data
      - /opt/actual/caddy_config:/config
    networks:
      - actual-net
    depends_on:
      actual:
        condition: service_healthy

networks:
  actual-net:
    driver: bridge
