# >>> CUSTOM: actual-financas — build e deploy na VM do GCE
# Não faz parte do upstream actualbudget/actual.
#
# Constrói a imagem, publica no GHCR com tag imutável (SHA do commit) e manda a
# VM subir exatamente essa tag. O deploy espera o healthcheck do container e faz
# rollback sozinho se a versão nova não subir (ver infra/deploy.sh).
# <<< CUSTOM

name: Deploy to GCE

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/**'
      - 'infra/**'
      - 'sync-server.Dockerfile'
      - '.github/workflows/deploy-gce.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag já publicada para subir (vazio = constrói do commit atual). Use para voltar a uma versão anterior.'
        type: string
        required: false

concurrency:
  # Nunca cancela um deploy no meio: cancelar entre o `pull` e o `up -d` deixa
  # a VM num estado indefinido.
  group: deploy-gce
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # obrigatório para o WIF

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/actual-server
  ZONE: us-east1-b
  INSTANCE: actual-financas
  PROJECT: actual-financas

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    # Num rollback por workflow_dispatch a imagem já existe; reconstruir seria
    # desperdício e mudaria o artefato que queremos restaurar.
    if: github.event.inputs.image_tag == ''
    outputs:
      image_tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build server
        run: yarn build:server
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: packages/sync-server/docker/ubuntu.Dockerfile
          platforms: linux/amd64
          # `sha-<commit>` é a tag que o deploy usa — imutável, e por isso
          # permite rollback determinístico. `edge` fica só como apelido
          # para humanos; nada automatizado depende dela.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    # `always()` + checagem explícita: num rollback o job `build` é pulado, e um
    # need pulado reprovaria o success() implícito, cancelando o deploy em cascata.
    if: always() && needs.build.result != 'failure' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra

      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.image_tag || needs.build.outputs.image_tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::nenhuma tag de imagem para publicar"
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publicando: $TAG"

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_APP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      - name: Sync infra files to VM
        run: |
          set -euo pipefail
          for f in docker-compose.prod.yml Caddyfile generate-env.sh deploy.sh backup.sh restore.sh; do
            echo "enviando $f"
            gcloud compute ssh "$INSTANCE" \
              --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet \
              --command="sudo tee /opt/actual/$f > /dev/null" < "infra/$f"
          done
          gcloud compute ssh "$INSTANCE" \
            --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet \
            --command="sudo chmod +x /opt/actual/*.sh"

      - name: Deploy
        run: |
          set -euo pipefail
          gcloud compute ssh "$INSTANCE" \
            --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet \
            --command="sudo /opt/actual/deploy.sh '${{ steps.tag.outputs.value }}'"

      - name: Smoke test
        run: |
          set -euo pipefail
          # Valida o caminho real do usuário — pela URL pública, atravessando
          # Caddy e TLS —, não só o container isolado.
          URL="https://actual-financas.fglivraria.com"
          echo "verificando $URL"
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --max-time 30 --output /dev/null "$URL"
          echo "aplicação respondendo"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Imagem | \`${{ steps.tag.outputs.value }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Resultado | ${{ job.status }} |"
            echo
            echo "Para voltar a uma versão anterior, rode este workflow manualmente"
            echo "informando a tag \`sha-<commit>\` desejada em **image_tag**."
          } >> "$GITHUB_STEP_SUMMARY"
