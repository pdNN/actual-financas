# >>> CUSTOM: actual-financas — build e deploy do serviço remoto no Cloud Run (spec 010)
# Não faz parte do upstream actualbudget/actual.
#
# Esteira adaptada da que o Pedro usa no smartdata-platform (WIF sem chave JSON,
# concorrência sem cancelar deploy em andamento, smoke test e rollback para a
# revisão anterior), reduzida a UM serviço. Segredos e permissões do serviço são
# do Terraform (infra/mcp-remoto.tf); este workflow só troca a imagem.
#
# Só age se o secret GCP_MCP_DEPLOYER_SA existir (valor da saída `mcp_deployer_sa`
# do Terraform) e se o serviço já tiver sido criado (mcp_servico_ativo = true).
# <<< CUSTOM

name: Deploy MCP (Cloud Run)

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/custom/**'
      - 'yarn.lock'
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag já publicada para subir (vazio = constrói do commit atual). Use para voltar a uma versão anterior.'
        type: string
        required: false

concurrency:
  # Nunca cancela um deploy no meio.
  group: deploy-mcp
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # obrigatório para o WIF

env:
  PROJECT_ID: actual-financas
  REGION: us-east1
  SERVICE: financas-mcp
  REPOSITORY: financas-mcp

jobs:
  test:
    name: Testes do pacote custom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: yarn install --immutable
      - run: yarn workspace @actual-financas/custom test

  deploy:
    name: Deploy no Cloud Run
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar configuração
        id: cfg
        env:
          DEPLOYER_SA: ${{ secrets.GCP_MCP_DEPLOYER_SA }}
          WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -z "$DEPLOYER_SA" ] || [ -z "$WIF" ]; then
            echo "::notice::GCP_MCP_DEPLOYER_SA / GCP_WORKLOAD_IDENTITY_PROVIDER não configurados: deploy do serviço remoto pulado."
            echo "ativo=false" >> "$GITHUB_OUTPUT"
          else
            echo "ativo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Autenticar no GCP (WIF, sem chave JSON)
        if: steps.cfg.outputs.ativo == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_MCP_DEPLOYER_SA }}

      - name: Instalar gcloud
        if: steps.cfg.outputs.ativo == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Definir a tag da imagem
        if: steps.cfg.outputs.ativo == 'true'
        id: img
        env:
          TAG_INFORMADA: ${{ inputs.image_tag }}
        run: |
          TAG="${TAG_INFORMADA:-sha-${GITHUB_SHA}}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "construir=$([ -z "${TAG_INFORMADA}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "imagem=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Construir e publicar a imagem
        if: steps.cfg.outputs.ativo == 'true' && steps.img.outputs.construir == 'true'
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f packages/custom/Dockerfile.mcp-remoto -t "${{ steps.img.outputs.imagem }}" .
          docker push "${{ steps.img.outputs.imagem }}"

      - name: Guardar a revisão atual (para rollback)
        if: steps.cfg.outputs.ativo == 'true'
        id: anterior
        run: |
          ANTERIOR="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          echo "revisao=${ANTERIOR}" >> "$GITHUB_OUTPUT"

      - name: Implantar a nova revisão (mantém variáveis e secrets do Terraform)
        if: steps.cfg.outputs.ativo == 'true'
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${{ steps.img.outputs.imagem }}" \
            --region "${REGION}" \
            --quiet

      - name: Smoke test
        if: steps.cfg.outputs.ativo == 'true'
        id: smoke
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.url)')"

          # 1. o processo está de pé
          test "$(curl -s -o /dev/null -w '%{http_code}' "${URL}/saude")" = "200"

          # 2. sem token ⇒ 401 com o ponteiro da metadata (exigência do Claude)
          CABECALHO="$(curl -s -i -X POST "${URL}/mcp" -H 'content-type: application/json' -d '{}')"
          echo "${CABECALHO}" | head -1 | grep -q " 401"
          echo "${CABECALHO}" | grep -qi '^www-authenticate: Bearer resource_metadata='

          # 3. descoberta pública
          curl -sf "${URL}/.well-known/oauth-protected-resource" | grep -q '"resource"'
          curl -sf "${URL}/.well-known/oauth-authorization-server" | grep -q '"code_challenge_methods_supported"'

          # 4. o log de requisições da plataforma (URL e IP) NÃO pode existir (princípio VIII)
          sleep 20
          LOGS="$(gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${SERVICE}\" AND log_id(\"run.googleapis.com/requests\")" \
            --freshness=10m --limit=1 --format='value(timestamp)')"
          if [ -n "${LOGS}" ]; then
            echo "::error::Há log de requisições do Cloud Run: a exclusão do Terraform não está valendo."
            exit 1
          fi

      - name: Rollback para a revisão anterior
        if: failure() && steps.cfg.outputs.ativo == 'true' && steps.anterior.outputs.revisao != ''
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --region "${REGION}" \
            --to-revisions "${{ steps.anterior.outputs.revisao }}=100" \
            --quiet
          echo "::warning::Deploy falhou; tráfego devolvido para ${{ steps.anterior.outputs.revisao }}."
